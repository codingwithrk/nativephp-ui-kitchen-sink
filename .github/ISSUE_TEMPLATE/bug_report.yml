name: Bug report
description: Something in the Kitchen Sink app doesn't work or looks wrong.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much as you can.

        **Security issue?** Don't report it here. Follow [SECURITY.md](https://github.com/codingwithrk/nativephp-ui-kitchen-sink/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Screenshots or a screen recording help a lot.
      placeholder: When I tap "Deploy" on the Card page, the button keeps spinning…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Components tab
        2. Go to Forms → Card
        3. Tap "Deploy"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: Pixel 8, Android 15 / iPhone 15 Pro, iOS 18.2 / Android emulator (Google APIs image)
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown on the About tab.
      placeholder: 1.0.0

  - type: dropdown
    id: area
    attributes:
      label: Where in the app?
      options:
        - Home
        - Components (a component page)
        - Themes
        - Templates
        - About
        - Update dialog / update screen
        - Ads
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Anything from `php artisan native:tail`, Xcode or Logcat. This is formatted as code automatically.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this hasn't been reported yet.
          required: true
        - label: This is about the Kitchen Sink app, not a bug inside a `<ui:*>` component itself (those go to connect@codingwithrk.com).
          required: false
